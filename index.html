<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Probability Casino</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
</head>
<body style="background: #09090b; margin: 0; padding: 0;">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { AreaChart, Area, LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

        // ─── Wheel constants ────────────────────────────────────────────────────────
        const WHEEL = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const RED   = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
        const N = 37, SA = 360 / N;

        const numFill  = n => n === 0 ? "#15803d" : RED.has(n) ? "#dc2626" : "#1c1c1e";
        const toRad    = d => (d - 90) * Math.PI / 180;
        const polarPt  = (cx, cy, r, deg) => [cx + r * Math.cos(toRad(deg)), cy + r * Math.sin(toRad(deg))];

        // Style tokens
        const panel = { background: "rgba(255,255,255,0.03)", borderRadius: 16, padding: 16, border: "1px solid rgba(255,255,255,0.07)" };
        const panelLabel = { color: "#71717a", fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", margin: "0 0 10px 0" };
        const metricCard = { background: "rgba(255,255,255,0.025)", borderRadius: 12, padding: "12px 14px", border: "1px solid rgba(255,255,255,0.06)" };
        const metricLabel = { color: "#52525b", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", margin: "0 0 4px 0" };
        const metricValue = { fontSize: 21, fontWeight: 900, margin: 0, fontFamily: "monospace" };

        function RouletteWheel({ rotation, spinning }) {
          const cx = 160, cy = 160, OR = 148, IR = 54;
          return (
            <div style={{ position: "relative", display: "inline-block" }}>
              <div style={{ position: "absolute", top: -2, left: "50%", transform: "translateX(-50%)", zIndex: 20, pointerEvents: "none", width: 0, height: 0, borderLeft: "8px solid transparent", borderRight: "8px solid transparent", borderTop: "24px solid #fbbf24", filter: "drop-shadow(0 0 8px rgba(251,191,36,0.8))" }}/>
              <svg width={320} height={320} viewBox="0 0 320 320" style={{ display: "block", transform: `rotate(${rotation}deg)`, transition: spinning ? "transform 4.3s cubic-bezier(0.04,0.9,0.12,1.0)" : "none" }}>
                <circle cx={cx} cy={cy} r={OR + 10} fill="#1c1917" stroke="#44403c" strokeWidth={3}/>
                <circle cx={cx} cy={cy} r={OR + 2}  fill="none" stroke="#92400e" strokeWidth={1.5}/>
                {WHEEL.map((num, i) => {
                  const a0 = i * SA, a1 = (i + 1) * SA;
                  const [ox0, oy0] = polarPt(cx, cy, OR, a0);
                  const [ox1, oy1] = polarPt(cx, cy, OR, a1);
                  const [ix1, iy1] = polarPt(cx, cy, IR, a1);
                  const [ix0, iy0] = polarPt(cx, cy, IR, a0);
                  const mid = (a0 + a1) / 2;
                  const [tx, ty] = polarPt(cx, cy, (OR + IR) / 2 + 2, mid);
                  const d = [ `M${ox0.toFixed(2)},${oy0.toFixed(2)}`, `A${OR},${OR} 0 0,1 ${ox1.toFixed(2)},${oy1.toFixed(2)}`, `L${ix1.toFixed(2)},${iy1.toFixed(2)}`, `A${IR},${IR} 0 0,0 ${ix0.toFixed(2)},${iy0.toFixed(2)}`, "Z" ].join(" ");
                  return (
                    <g key={i}>
                      <path d={d} fill={numFill(num)} stroke="#3f3f46" strokeWidth={0.6}/>
                      <text x={tx.toFixed(2)} y={ty.toFixed(2)} textAnchor="middle" dominantBaseline="middle" fontSize={num < 10 ? 9 : 8} fontWeight="700" fill="rgba(255,255,255,0.92)" transform={`rotate(${mid.toFixed(1)},${tx.toFixed(2)},${ty.toFixed(2)})`}>{num}</text>
                    </g>
                  );
                })}
                <circle cx={cx} cy={cy} r={IR} fill="#14532d" stroke="#166534" strokeWidth={1.5}/>
                <circle cx={cx} cy={cy} r={IR - 6} fill="none" stroke="#15803d" strokeWidth={1} strokeDasharray="4,4" opacity={0.4}/>
                <circle cx={cx} cy={cy} r={16} fill="#1c1917" stroke="#92400e" strokeWidth={1.5}/>
                <circle cx={cx} cy={cy} r={9}  fill="#fbbf24"/>
                <circle cx={cx} cy={cy} r={4}  fill="#78350f"/>
              </svg>
            </div>
          );
        }

        function RouletteTab({ stats, setStats, result, setResult, rotation, setRotation, spinning, setSpinning, rotRef }) {
          const [bet, setBet] = useState("red");
          const BET = 50;

          const checkWin = (n, b) => {
            if (n === 0) return false;
            if (b === "red")   return RED.has(n);
            if (b === "black") return !RED.has(n);
            if (b === "even")  return n % 2 === 0;
            if (b === "odd")   return n % 2 !== 0;
            if (b === "low")   return n <= 18;
            if (b === "high")  return n >= 19;
            return false;
          };

          const spin = () => {
            if (spinning) return;
            const idx = Math.floor(Math.random() * N);
            const num = WHEEL[idx];
            const target = idx * SA + SA / 2;
            const curr   = rotRef.current % 360;
            const delta  = ((target - curr) + 360) % 360 + 5 * 360;
            const newRot = rotRef.current + delta;
            rotRef.current = newRot;
            setSpinning(true);
            requestAnimationFrame(() => requestAnimationFrame(() => {
              setRotation(newRot);
              setTimeout(() => {
                setSpinning(false);
                setResult(num);
                const win = checkWin(num, bet);
                setStats(prev => ({
                  spins: prev.spins + 1,
                  wins: prev.wins + (win ? 1 : 0),
                  bankroll: prev.bankroll + (win ? BET : -BET),
                  history: [...prev.history.slice(-59), {
                    spin: prev.spins + 1,
                    bankroll: prev.bankroll + (win ? BET : -BET),
                    num, win
                  }]
                }));
              }, 4500);
            }));
          };

          const BETS = [
            { id: "red",   label: "RED",   color: "#dc2626" },
            { id: "black", label: "BLACK", color: "#71717a" },
            { id: "even",  label: "EVEN",  color: "#2563eb" },
            { id: "odd",   label: "ODD",   color: "#7c3aed" },
            { id: "low",   label: "1–18",  color: "#0e7490" },
            { id: "high",  label: "19–36", color: "#065f46" },
          ];

          const profit   = stats.bankroll - 1000;
          const winRate  = stats.spins > 0 ? (stats.wins / stats.spins * 100).toFixed(1) : "—";
          const evPerSpin = stats.spins > 0 ? (profit / stats.spins).toFixed(2) : "—";

          return (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 28, alignItems: "start" }}>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 20 }}>
                <RouletteWheel rotation={rotation} spinning={spinning}/>
                {result !== null && (
                  <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                    <div style={{ width: 54, height: 54, borderRadius: 12, flexShrink: 0, background: numFill(result), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, fontWeight: 900, color: "white", boxShadow: `0 0 20px ${numFill(result)}70` }}>{result}</div>
                    <div>
                      <p style={{ ...panelLabel, margin: 0 }}>RESULT</p>
                      <p style={{ fontSize: 15, fontWeight: 700, margin: "4px 0 0", fontFamily: "monospace", color: result === 0 ? "#4ade80" : RED.has(result) ? "#f87171" : "#d4d4d8" }}>
                        {result === 0 ? "✦ ZERO" : RED.has(result) ? "● RED" : "● BLACK"} · {result === 0 ? "SPECIAL" : result % 2 === 0 ? "EVEN" : "ODD"}
                      </p>
                    </div>
                  </div>
                )}
                <button onClick={spin} disabled={spinning} style={{ width: "100%", maxWidth: 280, padding: "14px 0", borderRadius: 14, border: "none", cursor: spinning ? "not-allowed" : "pointer", background: spinning ? "rgba(63,63,70,0.5)" : "linear-gradient(135deg,#dc2626,#991b1b)", color: spinning ? "#71717a" : "white", fontWeight: 800, fontSize: 14, letterSpacing: "0.15em", textTransform: "uppercase", boxShadow: spinning ? "none" : "0 0 30px rgba(220,38,38,0.35)", transition: "all 0.2s" }}>{spinning ? "SPINNING..." : "⚡  SPIN THE WHEEL"}</button>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={panel}>
                  <p style={panelLabel}>BET TYPE — EVEN MONEY (1:1)</p>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 10 }}>
                    {BETS.map(b => (
                      <button key={b.id} onClick={() => setBet(b.id)} style={{ padding: "9px 10px", borderRadius: 10, cursor: "pointer", border: `1.5px solid ${bet === b.id ? b.color : "rgba(255,255,255,0.08)"}`, background: bet === b.id ? `${b.color}1A` : "transparent", color: bet === b.id ? "white" : "#71717a", fontWeight: 700, fontSize: 12, letterSpacing: "0.08em", transition: "all 0.12s" }}>{b.label}</button>
                    ))}
                  </div>
                  <p style={{ color: "#3f3f46", fontSize: 11, margin: 0 }}>Bet: {BET} chips · P(win) = 18/37 ≈ 48.65% · EV = −2.70%</p>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  {[
                    { l: "BANKROLL",  v: `$${stats.bankroll}`, c: profit >= 0 ? "#4ade80" : "#f87171" },
                    { l: "SPINS",     v: stats.spins, c: "#e4e4e7" },
                    { l: "WIN RATE",  v: winRate === "—" ? "—" : `${winRate}%`, c: "#94a3b8" },
                    { l: "EV / SPIN", v: evPerSpin === "—" ? "—" : `$${evPerSpin}`, c: "#f87171" },
                  ].map(s => (
                    <div key={s.l} style={metricCard}>
                      <p style={metricLabel}>{s.l}</p>
                      <p style={{ ...metricValue, color: s.c }}>{s.v}</p>
                    </div>
                  ))}
                </div>
                {stats.history.length > 1 && (
                  <div style={panel}>
                    <p style={panelLabel}>BANKROLL HISTORY</p>
                    <ResponsiveContainer width="100%" height={105}>
                      <AreaChart data={stats.history} margin={{ top: 4, right: 4, bottom: 0, left: -24 }}>
                        <defs>
                          <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="5%"  stopColor="#dc2626" stopOpacity={0.28}/>
                            <stop offset="95%" stopColor="#dc2626" stopOpacity={0}/>
                          </linearGradient>
                        </defs>
                        <XAxis dataKey="spin" stroke="#3f3f46" tick={{ fontSize: 9, fill: "#52525b" }}/>
                        <YAxis stroke="#3f3f46" tick={{ fontSize: 9, fill: "#52525b" }} domain={["auto","auto"]}/>
                        <Tooltip contentStyle={{ background: "#18181b", border: "1px solid #3f3f46", borderRadius: 8, fontSize: 11 }} formatter={v => [`$${v}`, "Bankroll"]}/>
                        <ReferenceLine y={1000} stroke="#3f3f46" strokeDasharray="3 3"/>
                        <Area type="monotone" dataKey="bankroll" stroke="#dc2626" fill="url(#rg)" strokeWidth={2} dot={false}/>
                      </AreaChart>
                    </ResponsiveContainer>
                  </div>
                )}
                {stats.history.length > 0 && (
                  <div style={panel}>
                    <p style={panelLabel}>LAST {Math.min(12, stats.history.length)} RESULTS</p>
                    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {stats.history.slice(-12).map((h, i) => (
                        <div key={i} style={{ width: 30, height: 30, borderRadius: 7, flexShrink: 0, background: numFill(h.num), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "white", border: `2px solid ${h.win ? "#4ade80" : "transparent"}` }}>{h.num}</div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const THEORETICAL_EV = -(2 / 37);
        function MonteCarloTab() {
          const [data, setData] = useState([]);
          const [totalSims, setTotalSims] = useState(0);
          const [running, setRunning] = useState(false);

          const runSims = (n) => {
            if (running) return;
            setRunning(true);
            setTimeout(() => {
              let sum = 0;
              const MAX_POINTS = 300;
              const step = Math.max(1, Math.floor(n / MAX_POINTS));
              const pts = [];
              for (let i = 0; i < n; i++) {
                const idx = Math.floor(Math.random() * 37);
                const num = WHEEL[idx];
                sum += (num !== 0 && RED.has(num)) ? 1 : -1;
                if (i % step === 0 || i === n - 1) {
                  pts.push({ i: i + 1, mean: sum / (i + 1), theory: THEORETICAL_EV });
                }
              }
              setData(pts);
              setTotalSims(n);
              setRunning(false);
            }, 50);
          };

          const finalMean = data.length > 0 ? data[data.length - 1].mean : null;
          const converged = finalMean !== null && Math.abs(finalMean - THEORETICAL_EV) < 0.005;

          return (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={panel}>
                <p style={panelLabel}>MONTE CARLO ENGINE — BET: RED</p>
                <p style={{ color: "#52525b", fontSize: 13, margin: "0 0 6px", lineHeight: 1.6 }}>Simulate betting RED on European Roulette. The empirical mean converges to the theoretical expected value:</p>
                <p style={{ color: "#fbbf24", fontFamily: "monospace", fontSize: 13, margin: "0 0 18px" }}>μ̂ₙ = (1/n) Σ Xᵢ  →  E[X] = −2/37 ≈ −5.405%</p>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {[1000, 10000, 100000].map(n => (
                    <button key={n} onClick={() => runSims(n)} disabled={running} style={{ padding: "11px 22px", borderRadius: 12, cursor: running ? "not-allowed" : "pointer", background: running ? "rgba(63,63,70,0.4)" : "rgba(220,38,38,0.12)", border: `1px solid ${running ? "rgba(255,255,255,0.06)" : "rgba(220,38,38,0.3)"}`, color: running ? "#52525b" : "#f87171", fontWeight: 700, fontSize: 13, letterSpacing: "0.05em" }}>{running ? "..." : `${n.toLocaleString()} SPINS`}</button>
                  ))}
                </div>
              </div>
              {data.length > 0 && (
                <>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
                    {[
                      { l: "SIMULATIONS",    v: totalSims.toLocaleString(),               c: "#e4e4e7" },
                      { l: "EMPIRICAL MEAN", v: `${(finalMean * 100).toFixed(3)}%`,       c: "#f87171" },
                      { l: "THEORETICAL EV", v: "−5.405%",                                c: "#94a3b8" },
                    ].map(s => (
                      <div key={s.l} style={metricCard}>
                        <p style={metricLabel}>{s.l}</p>
                        <p style={{ ...metricValue, color: s.c }}>{s.v}</p>
                      </div>
                    ))}
                  </div>
                  <div style={panel}>
                    <p style={panelLabel}>CONVERGENCE — EMPIRICAL MEAN vs THEORETICAL EV</p>
                    <ResponsiveContainer width="100%" height={280}>
                      <LineChart data={data} margin={{ top: 8, right: 16, bottom: 0, left: -10 }}>
                        <XAxis dataKey="i" stroke="#3f3f46" tick={{ fontSize: 10, fill: "#52525b" }} tickFormatter={v => v >= 1000 ? `${(v/1000).toFixed(0)}k` : v}/>
                        <YAxis stroke="#3f3f46" tick={{ fontSize: 10, fill: "#52525b" }} tickFormatter={v => `${(v * 100).toFixed(1)}%`}/>
                        <Tooltip contentStyle={{ background: "#18181b", border: "1px solid #3f3f46", borderRadius: 8, fontSize: 11 }} formatter={(v, name) => [`${(v * 100).toFixed(3)}%`, name === "mean" ? "Empirical" : "Theoretical"]}/>
                        <ReferenceLine y={THEORETICAL_EV} stroke="#3b82f6" strokeDasharray="5 3" strokeWidth={1.5}/>
                        <Line type="monotone" dataKey="mean" stroke="#dc2626" dot={false} strokeWidth={2} name="mean" isAnimationActive={false}/>
                        <Line type="monotone" dataKey="theory" stroke="#3b82f6" dot={false} strokeWidth={1.5} name="theory" strokeDasharray="5 3" isAnimationActive={false}/>
                      </LineChart>
                    </ResponsiveContainer>
                  </div>
                </>
              )}
            </div>
          );
        }

        function MartingaleTab() {
          const [paths, setPaths] = useState([]);
          const [summary, setSummary] = useState(null);
          const [running, setRunning] = useState(false);
          const [params, setParams] = useState({ bankroll: 1000, baseBet: 10, maxSpins: 250 });

          const simulate = () => {
            if (running) return;
            setRunning(true);
            setTimeout(() => {
              const N_PATHS = 20; let busts = 0; const allPaths = [];
              for (let p = 0; p < N_PATHS; p++) {
                let bankroll = params.bankroll; let bet = params.baseBet; const path = [bankroll];
                for (let s = 1; s <= params.maxSpins; s++) {
                  if (bankroll <= 0 || bankroll < bet) { busts++; break; }
                  const idx = Math.floor(Math.random() * 37);
                  const num = WHEEL[idx]; const win = num !== 0 && RED.has(num);
                  bankroll += win ? bet : -bet; bankroll = Math.max(0, bankroll);
                  bet = win ? params.baseBet : bet * 2; path.push(bankroll);
                  if (bankroll <= 0) { busts++; break; }
                }
                allPaths.push(path);
              }
              const maxLen = Math.max(...allPaths.map(p => p.length)); const chartData = [];
              for (let i = 0; i < maxLen; i++) {
                const pt = { spin: i }; allPaths.forEach((path, pi) => { pt[`p${pi}`] = path[i] ?? 0; });
                chartData.push(pt);
              }
              setPaths(chartData); setSummary({ busts, survived: N_PATHS - busts, n: N_PATHS }); setRunning(false);
            }, 50);
          };

          const RED_SHADES = ["#dc2626","#ef4444","#f87171","#b91c1c","#991b1b","#dc2626","#ef4444","#f87171","#b91c1c","#991b1b","#dc2626","#ef4444","#f87171","#b91c1c","#991b1b","#dc2626","#ef4444","#f87171","#b91c1c","#991b1b"];

          return (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={panel}>
                <p style={panelLabel}>MARTINGALE STRATEGY GRAVEYARD</p>
                <p style={{ color: "#52525b", fontSize: 13, margin: "0 0 6px", lineHeight: 1.6 }}>Double your bet after every loss. The strategy feels unbeatable — until a losing streak meets your bankroll ceiling.</p>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 16, marginBottom: 18 }}>
                  {[
                    { key: "bankroll", label: "BANKROLL",  min: 200,  max: 10000, step: 100 },
                    { key: "baseBet",  label: "BASE BET",  min: 1,    max: 100,   step: 1   },
                    { key: "maxSpins", label: "MAX SPINS", min: 50,   max: 500,   step: 25  },
                  ].map(({ key, label, min, max, step }) => (
                    <div key={key}>
                      <p style={{ ...panelLabel, marginBottom: 6 }}>{label}: <span style={{ color: "#e4e4e7", fontFamily: "monospace" }}>{params[key].toLocaleString()}</span></p>
                      <input type="range" min={min} max={max} step={step} value={params[key]} onChange={e => setParams(p => ({ ...p, [key]: +e.target.value }))} style={{ width: "100%", accentColor: "#dc2626" }}/>
                    </div>
                  ))}
                </div>
                <button onClick={simulate} disabled={running} style={{ padding: "12px 28px", borderRadius: 12, border: "none", cursor: running ? "not-allowed" : "pointer", background: running ? "rgba(63,63,70,0.5)" : "linear-gradient(135deg,#dc2626,#7f1d1d)", color: running ? "#71717a" : "white", fontWeight: 800, fontSize: 14, letterSpacing: "0.1em", textTransform: "uppercase", boxShadow: running ? "none" : "0 0 24px rgba(220,38,38,0.3)", transition: "all 0.2s" }}>{running ? "SIMULATING..." : "☠  RUN GRAVEYARD"}</button>
              </div>
              {summary && (
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 12 }}>
                  {[
                    { l: "SIMULATIONS", v: summary.n, c: "#e4e4e7" },
                    { l: "WENT BUST",   v: `${summary.busts} (${Math.round(summary.busts/summary.n*100)}%)`, c: "#f87171" },
                    { l: "SURVIVED",    v: `${summary.survived} (${Math.round(summary.survived/summary.n*100)}%)`, c: "#4ade80" },
                  ].map(s => (
                    <div key={s.l} style={metricCard}>
                      <p style={metricLabel}>{s.l}</p>
                      <p style={{ ...metricValue, color: s.c }}>{s.v}</p>
                    </div>
                  ))}
                </div>
              )}
              {paths.length > 0 && (
                <div style={panel}>
                  <p style={panelLabel}>BANKROLL PATHS — 20 INDEPENDENT RUNS</p>
                  <ResponsiveContainer width="100%" height={300}>
                    <LineChart data={paths} margin={{ top: 8, right: 16, bottom: 0, left: -10 }}>
                      <XAxis dataKey="spin" stroke="#3f3f46" tick={{ fontSize: 10, fill: "#52525b" }}/>
                      <YAxis stroke="#3f3f46" tick={{ fontSize: 10, fill: "#52525b" }} tickFormatter={v => `$${v}`}/>
                      <Tooltip contentStyle={{ background: "#18181b", border: "1px solid #3f3f46", borderRadius: 8, fontSize: 11 }}/>
                      <ReferenceLine y={params.bankroll} stroke="#52525b" strokeDasharray="3 3"/>
                      {Array.from({ length: 20 }, (_, i) => (
                        <Line key={i} type="monotone" dataKey={`p${i}`} stroke={RED_SHADES[i]} dot={false} strokeWidth={1.5} opacity={0.65} isAnimationActive={false}/>
                      ))}
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}
            </div>
          );
        }

        const HERO_STATS = [ { v: "−2.70%", l: "House Edge" }, { v: "18/37", l: "P(Red Win)" }, { v: "0.000%", l: "Safe Systems" }, { v: "∞", l: "Risk of Ruin" } ];

        function ProbabilityCasino() {
          const [tab, setTab] = useState("roulette");
          const [stats, setStats] = useState({ spins: 0, wins: 0, bankroll: 1000, history: [] });
          const [result, setResult] = useState(null);
          const [rotation, setRotation] = useState(0);
          const [spinning, setSpinning] = useState(false);
          const rotRef = useRef(0);

          useEffect(() => {
            const style = document.createElement("style");
            style.textContent = `
              @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&display=swap');
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { background: #09090b !important; }
            `;
            document.head.appendChild(style);
            return () => document.head.removeChild(style);
          }, []);

          return (
            <div style={{ minHeight: "100vh", background: "#09090b", color: "white", fontFamily: "'JetBrains Mono', monospace", padding: "20px 0" }}>
              <header style={{ display: "flex", justifyContent: "between", padding: "10px 32px", borderBottom: "1px solid rgba(255,255,255,0.07)" }}>
                <div>
                  <h1 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, letterSpacing: "0.3em" }}>🎰 PROBABILITY CASINO</h1>
                </div>
              </header>
              <section style={{ maxWidth: 1100, margin: "0 auto", padding: "30px 32px", textAlign: "center" }}>
                <h2 style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 60, margin: "0 0 10px" }}>BEAT THE <span style={{ color: "#dc2626" }}>HOUSE</span></h2>
                <div style={{ display: "flex", gap: 14, justifyContent: "center", marginBottom: 30 }}>
                  {HERO_STATS.map(s => (
                    <div key={s.l} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 14, padding: "10px 20px" }}>
                      <p style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 24, margin: 0 }}>{s.v}</p>
                      <p style={{ fontSize: 9, color: "#52525b" }}>{s.l}</p>
                    </div>
                  ))}
                </div>
              </section>
              <div style={{ maxWidth: 1100, margin: "0 auto", padding: "0 32px" }}>
                <div style={{ display: "flex", gap: 4, marginBottom: 20, background: "rgba(255,255,255,0.025)", borderRadius: 14, padding: 4 }}>
                  {[ {id:"roulette", label:"🎡 Roulette"}, {id:"montecarlo", label:"📊 Monte Carlo"}, {id:"martingale", label:"☠ Martingale"} ].map(t => (
                    <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: 1, padding: "10px", background: tab === t.id ? "rgba(220,38,38,0.15)" : "transparent", color: tab === t.id ? "#f87171" : "#52525b", border: "none", borderRadius: 10, cursor:"pointer", fontWeight:700 }}>{t.label}</button>
                  ))}
                </div>
                {tab === "roulette" && <RouletteTab stats={stats} setStats={setStats} result={result} setResult={setResult} rotation={rotation} setRotation={setRotation} spinning={spinning} setSpinning={setSpinning} rotRef={rotRef} />}
                {tab === "montecarlo" && <MonteCarloTab />}
                {tab === "martingale" && <MartingaleTab />}
              </div>
            </div>
          );
        }

        const root = tragedies = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProbabilityCasino />);
    </script>
</body>
</html>
